<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Compare Dev: tecnologia da Compare, consultoria de seguro-saúde" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="pulso" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.78" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .titulo { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F5F1FF; letter-spacing: -1px; }
      .sub { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #B9AEDB; }
      .etiqueta { font: 600 13px 'Consolas', 'SFMono-Regular', Menlo, monospace; fill: #F97316; letter-spacing: 3px; }
      .entra { opacity: 0; animation: entra 0.9s ease-out forwards; }
      .entra.b { animation-delay: 0.25s; }
      .entra.c { animation-delay: 0.5s; }
      .traco { fill: none; stroke: url(#pulso); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .vivo { stroke-dasharray: 1; stroke-dashoffset: 1; animation: desenha 6s cubic-bezier(.6,.05,.3,1) infinite; }
      .ponto { fill: #F97316; animation: pulsa 6s ease-in-out infinite; transform-origin: 1120px 235px; }
      @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes desenha { 0% { stroke-dashoffset: 1; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes pulsa { 0%, 50% { transform: scale(0); opacity: 0; } 58% { transform: scale(1.5); opacity: 1; } 66%, 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .entra { animation: none; opacity: 1; }
        .vivo { animation: none; stroke-dashoffset: 0; }
        .ponto { animation: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#15111F"/>
  <rect width="1200" height="320" rx="18" fill="url(#brilho)"/>
  <text class="etiqueta entra" x="82" y="62">TIME DE TECNOLOGIA</text>
  <text class="titulo entra b" x="78" y="128">Compare Dev</text>
  <text class="sub entra c" x="82" y="166">Automações, integrações e dados para uma consultoria de seguro-saúde</text>
  <!-- o pulso que vira código: linha de batimento que desenha </> -->
  <path class="traco" opacity="0.16" d="M80 235 H470 L486 203 L504 267 L520 235 H610 M650 200 L610 235 L650 270 M690 282 L730 188 M770 200 L810 235 L770 270 M810 235 H900 L916 211 L932 259 L946 235 H1120"/>
  <path class="traco vivo" pathLength="1" d="M80 235 H470 L486 203 L504 267 L520 235 H610 M650 200 L610 235 L650 270 M690 282 L730 188 M770 200 L810 235 L770 270 M810 235 H900 L916 211 L932 259 L946 235 H1120"/>
  <circle class="ponto" cx="1120" cy="235" r="7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
