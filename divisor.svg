<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <style>
      .luz { fill: #FFFFFF; opacity: .55; animation: corre 5s ease-in-out infinite; }
      @keyframes corre { 0% { transform: translateX(-140px); } 100% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) { .luz { animation: none; opacity: 0; } }
    </style>
    <clipPath id="c"><rect x="0" y="3" width="1200" height="4" rx="2"/></clipPath>
  </defs>
  <rect x="0" y="3" width="1200" height="4" rx="2" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect class="luz" x="0" y="3" width="140" height="4"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
